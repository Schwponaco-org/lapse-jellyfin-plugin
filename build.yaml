overview: "Sync subtitles to audio (or subtitle to subtitle) using the LAPSE engine. Open Settings after installing to set it up."
description: >
  LAPSE lines up subtitles that have drifted out of sync, either against the
  item's own audio or against another subtitle file. Adds "Sync Subtitles" and
  "Sync Subtitles to Reference" to the context menu on films, episodes and
  loose videos, a dashboard for per-library settings, schedules, bulk syncing
  and engine management, and optional subtitle translation through Google
  Translate or a self-hosted Lingarr.

  After installing, open the plugin from Dashboard, Plugins, LAPSE. The
  dashboard walks you through installing the alignment engine, which is a
  single download. Nothing syncs until that is done.
category: "General"
