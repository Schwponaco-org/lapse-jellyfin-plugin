overview: "Sync subtitles to audio (or subtitle to subtitle) using the LAPSE engine"
description: >
  LAPSE lines up subtitles that have drifted out of sync, either against the
  movie's own audio or against another subtitle file. Adds a "Sync Subtitles"
  button to the movie context menu, a dashboard page for bulk syncing a
  whole library or folder, and auto-syncs new movies as they get added.
