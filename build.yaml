changelog: >
  Works with LAPSE 2.5.1.

  Save works again on every Settings tab. It left the spinner going and saved
  nothing.

  Advanced under Sync subtitles fits on a big screen and scrolls, so the top
  can be reached.

  Subtitle tools in the player works with a TV remote. Back closes it and the
  film keeps playing, the arrows move between the buttons, and the focus can be
  seen on older LG and Samsung TVs. The LAPSE dialogs from an item's menu start
  on their first field on a TV, and their sliders can be reached.

  Sync now in the player keeps its result on screen, and the panel follows the
  subtitle that player has on after a track switch. A failed sync no longer
  leads with onnxruntime's CPU warning on ARM servers.
