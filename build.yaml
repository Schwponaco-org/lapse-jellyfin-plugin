changelog: >
  Mostly a security and reliability release, and worth taking if other
  users on your server can sign in.

  The settings endpoint was readable by any signed-in user, not just
  admins, and it included your DeepL, Google and OpenSubtitles keys, the
  OpenSubtitles password and the Radarr/Sonarr webhook token. That and the
  other dashboard-only endpoints need an admin now. If you've had
  non-admin accounts on the server, it's worth rotating those keys.

  If you'd opened subtitle access up to other users, they could also edit
  subtitles on items in libraries they don't have access to, or above
  their parental rating. They now only see what Jellyfin itself lets them
  see.

  Two edits to the same subtitle at once - a quick double press on the
  delay buttons, or a shift while the queue was syncing that file - could
  leave an empty subtitle behind. Writes now go through a temporary file
  and take turns per file, so that can't happen anymore.

  Also fixed: an error in auto-sync or the per-library schedule could
  take the whole Jellyfin server down with it; one unexpected error could
  jam the sync queue until a restart; and servers where an old version
  had patched index.html on disk (the official Docker image among them)
  never picked up the cache busting from 2.0.1, so browsers kept running
  an old copy of the script. That one needs a hard refresh once.

  New since 2.0.1: the engine card warns you when LAPSE has fallen back
  to its weaker built-in voice detector because the Silero model or
  onnxruntime is missing. And "Sync even when the engine is unsure" now
  sits on the engine card itself, and a skipped low-confidence sync
  offers to turn it on and try again right there.
