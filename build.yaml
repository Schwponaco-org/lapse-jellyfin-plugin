changelog: >
  Works with LAPSE 2.3.2.

  Since 2.3.1 the engine reports a subtitle with too few lines in its JSON
  answer instead of only on stderr, and the plugin stopped recognising it. A
  short forced track then just failed, where it used to get a second try with
  --force. It gets that second try again, in batch runs too, and the result no
  longer says it was "matched against none".

  The engine's format notes now say where .stl and .scc files can go
  instead. LAPSE syncs them, Jellyfin just can't show them, so they're
  pointed at LAPSE in the browser or the Docker image.
