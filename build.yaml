changelog: >
  Verified against Jellyfin 12.0 as well as 10.11: plugin load, script
  injection, subtitle discovery, sync, convert, readable subtitles,
  embedded extraction and remux all check out unchanged. The build still
  targets 10.11.0.0, on purpose - every Jellyfin type this plugin uses is
  the same across both, so one artifact keeps serving 10.11 and 12
  installs alike rather than cutting 10.11 users off.

  LAPSE's engine gained forced output encoding and cut-snapping, and both
  are now reachable from the engine's advanced settings. "Write every
  result in one encoding" forces utf8, utf8-bom, utf16le, utf16be or
  latin1 instead of a file going back out however it came in, for a
  library that is a mix of UTF-16 and old codepage files. "Snap cue
  starts onto picture cuts" pulls a cue that lands within a window of a
  scene cut onto it, since a subtitler writing to picture puts a line up
  on the cut and a file moved by one number can be right to within a few
  frames and still read late throughout. Both are off unless set, and
  neither is offered to an engine build that predates them.

  Ticking individual subtitles in the Readable Subtitles dialog never
  actually wrote anything - the picked tracks arrived empty on every
  request and the dialog fell back to "at least one subtitle is
  required". Fixed, along with the file collision that surfaced behind
  it: restyling both a .srt and its converted .ass copy at once could
  overwrite one readable copy with the other, or replace the wrong
  track entirely.
