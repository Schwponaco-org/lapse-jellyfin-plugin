changelog: >
  Brings the plugin up to LAPSE 2.3.0.

  A subtitle that fits another copy of a film can now be moved onto this one.
  LAPSE listens to both copies and moves every line the way the speech around
  it moved, so a TV recording, a PAL release or a cut with a scene missing all
  come out right, short forced tracks included. It's in the item menu as Move
  Subtitles from Another Copy, and in the dashboard's Advanced dialog, and it
  finds the other versions Jellyfin groups with an item as well as the same
  film in another library. The result is named after this video and never
  goes over a subtitle that's already there.

  The engine's advanced settings take a whisper.cpp model, which makes LAPSE
  only trust the stretches of speech whisper hears words in. The card says
  when the model or whisper-cli can't be found, and when a setting needs a
  newer LAPSE than the one installed.

  A split file now shows where each part went instead of one offset for the
  lot, and counts as already in sync when no part would move further than the
  tolerance. Snapping to picture cuts moves cue ends too with 2.3.0.
