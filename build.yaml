changelog: >
  Works with LAPSE 2.5.1.

  The engine's advanced settings get Threads for listening, which passes
  --threads to LAPSE 2.5.1 so a sync on a small server leaves room for
  playback. Older builds leave it off.

  The LAPSE page is on tabs, with the settings in fewer sections and engine,
  sync and review status side by side on the Overview. LAPSE has the large card
  on the Engines tab. Multi engine sync has its own switch and can be turned on
  right after installing an engine, and macOS servers are told alass has no
  builds for them.

  Subtitle tools in the player saves the delay into the subtitle that player
  shows and reloads it, so the change is not undone on screen. Jellyfin's own
  offset slider is hidden while it is open, and the mouse wheel no longer
  changes the volume there. A library that is turned off shows New items and
  Schedule unticked.
