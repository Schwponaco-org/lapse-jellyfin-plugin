changelog: >
  Any running sync job - bulk, a series, or a schedule - can now be stopped
  from the dashboard or the progress toast, killing the engine process
  rather than leaving it running in the background.

  Sync Subtitles to Reference (renamed from Sync All Subtitles to Reference)
  can now line up just one chosen track instead of always doing every other
  subtitle. Embedded subtitle tracks no longer count towards an item's sync
  status by default, since nothing automatic ever touches them; a setting
  brings them back in for anyone who syncs embedded tracks by hand.

  Translation, marked experimental, gets several fixes: DeepL retries on 429
  and 5xx with backoff instead of failing outright, the metadata header no
  longer breaks .srt (which has no comment syntax) and is placed correctly
  in .vtt, and a configurable default source/target language fills the
  Translate boxes in instead of starting empty. The Advanced sync dialog is
  reworked so every action sits in one row at the bottom.

  A subtitle the engine turns away for having too few cues to judge is now
  retried once with --force. Disabling a library now turns off its "new
  items" and "schedule" sync automatically, instead of leaving them
  checked-and-inert until the library is turned back on.
