changelog: >
  A big one. LAPSE now has a subtitle panel in the video player itself -
  open "Subtitle tools" from the CC menu while something is playing and
  you get a delay slider that drives Jellyfin's own live offset (so it
  works with libass/ASS, plain text tracks, everything), a Save to file
  button that bakes the delay in for good, a one-press Sync without
  leaving the film, quick track switching, a rescan for subtitles LAPSE
  can see but Jellyfin hasn't picked up, OpenSubtitles fetching, and
  appearance settings with a live preview. Web client only for now.

  Multi engine sync (experimental): when LAPSE isn't sure a sync actually
  worked, it can now run alass and ffsubsync over the same subtitle too
  and write every engine's answer as its own subtitle track, so instead
  of one questionable file you get all of them to compare in the player
  and a Keep this subtitle button in the new panel once you've found the
  one that's actually right. Marked experimental because it's new and
  leaves extra files sitting next to the video until you act on them; off
  by default and needs turning on under Settings.

  LAPSE also shows up in the dashboard's own sidebar now, under Plugins,
  instead of being three clicks deep under Dashboard > Plugins > My
  Plugins.

  Two bugs fixed: alass wouldn't install on Windows (the zip layout
  tripped up how the plugin picked the binary out of it), and a server
  running a non-UTF-8 code page - Chinese Windows installs, mainly -
  could read a finished sync back as garbled JSON and report it as
  failed even though the file had been written correctly. Engine output
  is read as UTF-8 explicitly now, whatever the server's locale is.

  Also: the OpenDyslexic button can uninstall the font again once it's
  installed, instead of just sitting there.

  Checked against Jellyfin 12.0 as well as 10.11 - still one artifact for
  both, still targeting 10.11.0.0, nothing here needed the newer ABI.
