changelog: >
  v2.0.0's in-player subtitle panel shipped working, but almost nobody could
  tell. The injected script had no cache busting, so a browser that had
  already loaded the client kept running whatever it cached before the panel
  existed - fixed by putting the plugin's own version in the script and
  stylesheet URLs, so an update actually reaches people from here on.

  For anyone who did get the new script: the "Subtitles" sheet from the CC
  button could run its last track off the bottom of the screen (worse with
  multi engine sync's extra candidate tracks), and the delay slider never
  seemed to move anything. The real cause of the second one: the panel's own
  "Subtitle tools" button didn't stop its click from bubbling into Jellyfin's
  own subtitle-track-picker handler, which read the click as a track
  selection it didn't recognise and quietly turned subtitles off - confirmed
  directly in Jellyfin's own console output every time the button was
  pressed. By the time the slider ran, there was nothing left selected to
  move. Every button this menu system adds now stops that from happening.
  Also fixed along the way: the sheet-fitting logic assumed a sheet starts
  near the top of the window, which is wrong for the kind jellyfin-web
  centres near the button that opened it; a slider verification step that
  was racing Jellyfin's own 100ms offset debounce and losing on every call;
  and admin-saved subtitle appearance settings silently dropping the font
  and letter spacing on every save.

  Verified live this time, not just against decompiled source: a real
  Jellyfin 10.11.11 server, this plugin actually built and installed into
  it, driven end to end with a real browser.

  If you installed v2.0.0 and the panel never seemed to do anything, this is
  that fix - it needs a hard refresh of the web client once, since that is
  exactly the cache this release stops happening again.
