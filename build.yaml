changelog: >
  Subtitle tracks living inside a video file can now be pulled out as ordinary
  subtitle files from a new "Extract Embedded Subtitles" entry in the item
  menu. Removing the tracks from the video afterwards, and replacing the
  original video with the rebuilt one, are two further opt-ins on the same
  dialog, so the safe answer stays the default. Nothing is re-encoded, so the
  picture and sound come out identical, and a track that could not be saved as
  a file first (PGS, VobSub) is never dropped.

  A new "Readable Subtitles" entry writes a copy of a subtitle with a
  dyslexia-friendly font, larger text and wider letter spacing set inside the
  file rather than in a client setting. The dashboard can install OpenDyslexic
  into Jellyfin's fallback font folder and turn the server's fallback font
  setting on.

  Syncing the same embedded track more than once no longer leaves a pile of
  duplicate subtitle files behind. The extracted file now has one name per
  track and is reused, which also means an overwrite output mode has something
  of its own to overwrite. The sync dialog now says so when the chosen track is
  still inside the video, since no output mode can write back into it.

  Automatic translation through Lingarr no longer fails with HTTP 500. The
  unattended path never set a source language, so it sent "auto", which Lingarr
  validates as a culture and rejects. It now uses the configured default and
  falls back to the subtitle's own filename language tag.
