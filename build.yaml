changelog: >
  Readable Subtitles now fits its styling to the script the subtitle is
  actually in, instead of assuming Latin. OpenDyslexic has no Arabic, Hebrew,
  Thai or CJK glyphs at all, so those get a configurable fallback font
  instead and keep the larger text, heavier outline and margin; letter
  spacing is dropped where it would pull joined-up letters apart or separate
  a stacked mark from its base; and Arabic and Hebrew are written right to
  left. The dominant script is worked out by counting letters in the
  dialogue, so a subtitle with the odd English name in it is still read
  correctly.

  The dialog now ticks individual subtitles rather than restyling whatever
  was selected, and by default writes the readable version beside the
  original as a second track rather than over it, so one person's readable
  subtitle no longer takes everyone else's away on a shared library.
  Replacing is still offered, but the original is kept as a backup, and
  "Back to normal" in the same dialog undoes either kind - deleting the
  copies it made, or restoring what it replaced. Automation can now write
  readable copies unattended, off by default, either adding them beside
  every subtitle a run touches or replacing them.

  Subtitle appearance during playback can now be set per user rather than
  server-wide, from a new "Subtitle settings" entry in the player's own
  subtitle menu: size, letter spacing, colour, background and font,
  including any font installed on the server. It follows the account onto
  every device and changes nothing for anyone else sharing the library. The
  dashboard's own appearance settings remain the starting point for anybody
  who hasn't set their own.

  The subtitle format list now says which of the three formats sharing the
  .sub extension - MicroDVD, MPL2 or SubViewer 2 - a file actually is, since
  the extension alone doesn't say, and only one of the three needs a frame
  rate to make sense of its numbers.
