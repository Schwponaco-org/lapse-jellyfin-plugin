overview: "Sync subtitles to audio (or subtitle to subtitle) using the LAPSE engine. Open Settings after installing to set it up."
description: >
  LAPSE lines up subtitles that have drifted out of sync, either against the
  item's own audio or against another subtitle file. Adds "Sync Subtitles" and
  "Sync All Subtitles to Reference" to the context menu on films, episodes and
  loose videos, a dashboard for per-library settings, schedules, bulk syncing
  and engine management, and optional subtitle translation through Google
  Translate or a self-hosted Lingarr.

  After installing, open the plugin from Dashboard, Plugins, LAPSE. The
  dashboard walks you through installing the alignment engine, which is a
  single download. Nothing syncs until that is done.
category: "General"
owner: "rs-jensen"
artifacts:
- "Jellyfin.Plugin.Lapse.dll"
changelog: >
  Supports LAPSE 2.0.3's wider subtitle format list (adds MicroDVD, PGS,
  VobSub, SubViewer, SAMI, TTML and DFXP on top of srt/vtt/ass/ssa), read
  straight from the installed binary so converting before syncing is only
  needed when the engine can't read the format. Adds an Automation page for
  what unattended runs (scheduled task, per-library schedules, new items,
  bulk, webhook) do to a subtitle, including an experimental auto-translate
  option, and a per-library toggle for picking up newly added items without
  waiting for the schedule.
