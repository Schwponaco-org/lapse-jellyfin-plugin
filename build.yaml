changelog: >
  Works with LAPSE 2.3.3.

  LAPSE 2.3.3 stopped writing a result it isn't sure of to the path it was
  given and puts it next to it instead. The plugin didn't know, so every unsure
  sync failed with "didn't write anything" and left a file ending in
  .lapse-tmp.lapse-unsure.srt beside the subtitle. Unsure results are handled
  the way your low confidence setting says again. If you ran the new engine on
  the old plugin, those leftover files are safe to delete.

  Taking embedded subtitles out of a video no longer reports a failure when the
  new video went into place fine and only the old copy couldn't be removed.
