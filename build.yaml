changelog: >
  Works with LAPSE 2.5.0.

  When LAPSE is unsure, its answer goes to the new Review panel on the
  dashboard. You can play the item from a few points with the answer on, then
  keep it or discard it.

  Results stay on screen until you close them, and Recent activity says in
  plain words what each sync and shift did, with Undo. A shift by hand can be
  undone too.

  A subtitle that Jellyfin or Bazarr downloads later gets synced in libraries
  with New items ticked. Bazarr calls Lapse/Webhook/Path, the README has the
  line for it.

  A bulk, series or scheduled run can post to ntfy or Discord when it is done,
  and a whole bulk run can be undone.

  Shift works on every format LAPSE 2.5.0 reads, and .itt is a known format.
  On Alpine and other musl systems the musl build of LAPSE is installed. The
  engine gives way to Jellyfin's transcodes, and the Engines page shows the
  size of its cache and can clear it.

  The dashboard and dialogs look like the rest of Jellyfin, in the light theme
  and on a phone too. The Edit subtitles dialog gets a Sync button, and Subtitle
  tools in the player works from a keyboard or a remote.

  GBK, Big5, Shift_JIS and EUC-KR subtitles are no longer read as Thai or
  Cyrillic.

  Undoing readable subtitles could delete another file named after the video.
  It now only deletes the copies it wrote.
